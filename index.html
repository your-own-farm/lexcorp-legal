<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LexCorp Legal & Compliance — Trusted legal counsel and regulatory compliance advisory for businesses across India." />
    <title>LexCorp Legal & Compliance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- GitHub Pages SPA routing: decode redirect from 404.html -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = location.search;
        if (search.indexOf('?p=/') === 0 || search.indexOf('p=/') === 0) {
          var params = search.slice(1).split('&');
          var p = params[0].replace('p=', '').replace(/~and~/g, '&');
          var q = params[1] ? ('?' + params[1].replace('q=', '').replace(/~and~/g, '&')) : '';
          history.replaceState(null, null, '/lexcorp-legal' + p + q + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
