<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LexCorp Legal & Compliance — Trusted legal counsel and regulatory compliance advisory for businesses across India." />
    <title>LexCorp Legal & Compliance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- GitHub Pages SPA routing: restore deep-link path saved by 404.html -->
    <script>
      (function() {
        var dest = sessionStorage.getItem('spa_redirect');
        if (dest) {
          sessionStorage.removeItem('spa_redirect');
          if (dest !== location.href) {
            history.replaceState(null, null, dest);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
